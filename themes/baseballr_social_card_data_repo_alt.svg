<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    baseballr-data social card, 1280x640. Part of the SportsDataverse card family:
    gradient field in the package's own brand color, a sport motif watermark,
    the wordmark, a tagline, and the gold-topped footer bar carrying the URL.
    Generated by make_cards.py; edit the config there and re-render rather
    than hand-editing this file.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A0B18"/>
      <stop offset="100%" stop-color="#160408"/>
    </linearGradient>
    <radialGradient id="focus" cx="50%" cy="39%" r="62%">
      <stop offset="0%" stop-color="#160408" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#160408" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>

  <!-- motif sits back so the type leads; it fought the tagline at 0.45 -->
  <g opacity="0.32">
    <g stroke="#7A3245" stroke-width="9" fill="none" stroke-linejoin="round">
    <path d="M640,600 L240,200"/><path d="M640,600 L1040,200"/>
    <path d="M240,200 A566,566 0 0 1 1040,200"/>
    </g>
    <g stroke="#E8CBA0" stroke-width="10" fill="none" stroke-linejoin="round">
    <polygon points="640,540 800,380 640,220 480,380"/>
    </g>
    <g fill="#E8CBA0">
    <rect x="618" y="518" width="44" height="44" rx="6"/>
    <rect x="778" y="358" width="44" height="44" rx="6"/>
    <rect x="618" y="198" width="44" height="44" rx="6"/>
    <rect x="458" y="358" width="44" height="44" rx="6"/>
    <circle cx="640" cy="380" r="26"/>
    </g>
  </g>
  <!-- soft pool behind the type so the motif never runs through a letterform -->
  <rect width="1280" height="554" fill="url(#focus)"/>

  <text x="640" y="290" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="111" font-weight="700"
        stroke="#160408" stroke-width="14" paint-order="stroke"><tspan fill="#FFFFFF">baseballr</tspan><tspan fill="#E8CBA0">-data</tspan></text>

  <text x="640" y="359" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="34" font-weight="600" fill="#E8CBA0"
        letter-spacing="3">THE BASEBALL DATA RELEASES</text>

  <rect x="0" y="554" width="1280" height="86" fill="#160408"/>
  <rect x="0" y="554" width="1280" height="4" fill="#FFB612"/>
  <text x="640" y="612" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="32" font-weight="600" fill="#EEF2F6"
        letter-spacing="2">baseballr.sportsdataverse.org</text>
</svg>
